<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6f4e"><title>Companion XL • Kategória</title><style>
:root{--green:#2f6f4e;--green2:#3f8a63;--cream:#f7f4ed;--ink:#24302a;--muted:#718077;--line:#e3e5df;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.app{max-width:820px;margin:auto;min-height:100vh;padding-bottom:80px}.top{position:sticky;top:0;z-index:20;background:rgba(247,244,237,.96);backdrop-filter:blur(14px);padding:12px 16px;border-bottom:1px solid rgba(227,229,223,.8)}

.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(820px,100%);height:68px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#758079;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}.nav button b{font-size:21px;line-height:1}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}}

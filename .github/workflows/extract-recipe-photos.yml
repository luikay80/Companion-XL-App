name: Extract recipe photos # extractor-v2

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/recipes/source/**"
      - "recipe-image-map.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tooling
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf

      - name: Download source recipe book
        run: |
          mkdir -p /tmp/companion
          curl -L --fail --retry 3 -o /tmp/companion/source.pdf "https://www.moulinex.fr/medias/Companion-XL-Landingpage-Recipebook-FR.pdf?context=bWFzdGVyfHJvb3R8NzYyNjgyMnxhcHBsaWNhdGlvbi9wZGZ8aDFkL2g5MC8xNDI3MTIwNTgzNDc4Mi5wZGZ8MmM0MDk1MjNiMzg5ZTE3ZTU5NmIzMjY1NDUwZDE5YmRlYjlkZWJlMzBlNDA3Y2QxZDI5ODk1MjM4ODk4NmUwZg"

      - name: Extract recipe photos and build map
        run: |
          python <<'PY'
          import fitz, os, re, json, unicodedata
          src='/tmp/companion/source.pdf'
          out='assets/recipes/source'
          os.makedirs(out,exist_ok=True)
          d=fitz.open(src)
          rows=[]
          for pi in range(22,174):
              pg=d[pi]
              photos=[]
              for im in pg.get_images(full=True):
                  xref,w,h=im[0],im[2],im[3]
                  if not (299<=w<=301 and 211<=h<=214):
                      continue
                  for rect in pg.get_image_rects(xref):
                      if 40<=rect.x0<=600 and 70<=rect.y0<=100 and rect.width>290 and rect.height>200:
                          photos.append((rect.x0,xref))
              titles=[]
              for b in pg.get_text('blocks'):
                  x0,y0,x1,y1,txt,*_=b
                  if 295<=y0<=370:
                      t=' '.join(txt.replace('\\xa0',' ').split())
                      if t and re.search(r'[A-Za-zÀ-ÿ]',t):
                          titles.append((x0,x1,t))
              for xref_x in sorted(photos,key=lambda z:z[0]):
                  px0,xref=xref_x
                  pc=px0+150
                  left=pc < pg.rect.width/2
                  same=[t for t in titles if (((t[0]+t[1])/2)<pg.rect.width/2)==left]
                  t=min(same,key=lambda z:abs(((z[0]+z[1])/2)-pc))
                  fn=f"photo-{len(rows)+1:03d}.jpg"
                  with open(os.path.join(out,fn),'wb') as f:
                      f.write(d.extract_image(xref)['image'])
                  rows.append({'title':t[2],'file':f'assets/recipes/source/{fn}','pdfPage':pi+1})
          assert len(rows)==294, f"Expected 294 recipe photos, found {len(rows)}"
          def norm(s):
              s=s.replace('Œ','OE').replace('œ','oe')
              s=unicodedata.normalize('NFD',s)
              s=''.join(ch for ch in s if unicodedata.category(ch)!='Mn')
              s=s.lower()
              s=re.sub(r'[^a-z0-9]+',' ',s).strip()
              return re.sub(r'\\s+',' ',s)
          mp={}
          for r in rows:
              k=norm(r['title'])
              if k in mp:
                  raise SystemExit(f"Duplicate title key: {r['title']}")
              mp[k]='source/'+os.path.basename(r['file'])
          with open('recipe-image-map.js','w',encoding='utf-8') as f:
              f.write('window.CompanionRecipeImageMap='+json.dumps(mp,ensure_ascii=False,indent=2)+';\\n')
          print('Extracted',len(rows),'photos')
          PY

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/recipes/source recipe-image-map.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Generate source recipe photos [skip ci]"
          git push

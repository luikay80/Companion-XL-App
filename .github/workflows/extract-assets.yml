name: Import original Companion XL assets

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import uploaded asset package
        run: |
          set -euo pipefail
          if [ ! -f "CompanionXL_original_assets.zip" ]; then
            echo "No CompanionXL_original_assets.zip found; nothing to import."
            exit 0
          fi
          unzip -o "CompanionXL_original_assets.zip" -d .
          rm "CompanionXL_original_assets.zip"
          test -f assets/recipes/gougeres.jpg
          test -f assets/recipes/guacamole.jpg
          test -f assets/recipes/houmous.jpg
          test -f assets/recipes/salmon.jpg
          test -f assets/recipes/zucchini.jpg
          test -f assets/recipes/samosas.jpg
          test -f assets/recipes/scones.jpg
          test -f assets/recipes/pumpkin.jpg
          test -f assets/accessories/ultrablade.jpg
          test -f assets/accessories/kneading.jpg
          test -f assets/accessories/beater.jpg
          test -f assets/accessories/mixer.jpg
          test -f assets/accessories/steam.jpg
          test -f assets/accessories/fondxl.jpg
          echo "All original images imported successfully."

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets CompanionXL_original_assets.zip
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add original Companion XL recipe photos and accessory icons"
            git push
          fi

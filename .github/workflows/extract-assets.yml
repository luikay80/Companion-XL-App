name: Extract original Companion XL assets

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  extract-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original Moulinex PDF
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://www.moulinex.fr/medias/Companion-XL-Landingpage-Recipebook-FR.pdf?context=bWFzdGVyfHJvb3R8NzYyNjgyMnxhcHBsaWNhdGlvbi9wZGZ8aDFkL2g5MC8xNDI3MTIwNTgzNDc4Mi5wZGZ8MmM0MDk1MjNiMzg5ZTE3ZTU5NmIzMjY1NDUwZDE5YmRlYjlkZWJlMzBlNDA3Y2QxZDI5ODk1MjM4ODk4NmUwZg"
          urllib.request.urlretrieve(url, "Companion-XL-Landingpage-Recipebook-FR.pdf")
          print("Downloaded original PDF")
          PY

      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check PyMuPDF

      - name: Extract original recipe photos and accessory icons
        run: |
          python - <<'PY'
          import fitz, os, shutil

          PDF = "Companion-XL-Landingpage-Recipebook-FR.pdf"
          out = "assets"
          shutil.rmtree(out, ignore_errors=True)
          os.makedirs(out + "/recipes", exist_ok=True)
          os.makedirs(out + "/accessories", exist_ok=True)

          doc = fitz.open(PDF)

          recipe_pages = {
              26: ["gougeres", "guacamole"],
              27: ["houmous", "salmon"],
              28: ["zucchini", "samosas"],
              29: ["scones", "pumpkin"],
          }

          for page_no, names in recipe_pages.items():
              page = doc[page_no - 1]
              candidates = []
              for info in page.get_image_info(xrefs=True):
                  xref = info.get("xref", 0)
                  bbox = info.get("bbox")
                  if not xref or not bbox:
                      continue
                  w = bbox[2] - bbox[0]
                  h = bbox[3] - bbox[1]
                  if w > 250 and h > 150:
                      candidates.append((bbox[0], bbox, xref))
              candidates.sort(key=lambda x: x[0])
              if len(candidates) != 2:
                  raise RuntimeError(f"Expected 2 recipe photos on PDF page {page_no}, found {len(candidates)}")
              for name, (_, bbox, xref) in zip(names, candidates):
                  data = doc.extract_image(xref)
                  ext = data.get("ext", "jpg")
                  with open(f"{out}/recipes/{name}.{ext}", "wb") as f:
                      f.write(data["image"])

          # Page 9 of the PDF contains the six accessory illustrations.
          page = doc[8]
          accessory_targets = {
              "ultrablade": (648, 225),
              "kneading": (804, 226),
              "beater": (968, 225),
              "mixer": (648, 382),
              "steam": (804, 385),
              "fondxl": (950, 390),
          }
          infos = [i for i in page.get_image_info(xrefs=True) if i.get("xref")]
          for name, (cx0, cy0) in accessory_targets.items():
              found = None
              best = 1e9
              for info in infos:
                  x1,y1,x2,y2 = info["bbox"]
                  # Ignore the full-page background image.
                  if (x2-x1) > 300 or (y2-y1) > 300:
                      continue
                  cx, cy = (x1+x2)/2, (y1+y2)/2
                  d2 = (cx-cx0)**2 + (cy-cy0)**2
                  if d2 < best:
                      best = d2
                      found = info
              if not found or best > 2500:
                  raise RuntimeError(f"Accessory illustration not found: {name}")
              data = doc.extract_image(found["xref"])
              ext = data.get("ext", "jpg")
              with open(f"{out}/accessories/{name}.{ext}", "wb") as f:
                  f.write(data["image"])

          print("Assets extracted successfully.")
          for root, _, fs in os.walk(out):
              for fn in sorted(fs):
                  p=os.path.join(root,fn)
                  print(p, os.path.getsize(p))
          PY

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "Add original Companion XL recipe photos and accessory icons"
            git push
          fi
